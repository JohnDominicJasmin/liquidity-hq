# Tells QA there is work waiting, without anyone having to remember to say so.
#
# THE GAP THIS CLOSES. Dev promotes `dev` -> `qa`. Nothing announced it.
# CONTRIBUTING said "ask QA before promoting", which is a courtesy BEFORE the
# fact; the feature PRs carrying "How to test (QA)" are all closed by then; and
# the release PR that aggregates them is opened by QA themselves, after they
# have already decided to look. So the only thing telling QA work was waiting
# was a human remembering to mention it.
#
# HOW THE SIGNAL IS COMPUTED. From `staging..qa`, not from the push event.
# That range is the definition of the thing we want - commits on qa that QA has
# not yet taken into staging - so it is correct after a force-push, a re-run, a
# revert, or several promotions in a row with no one looking in between. Push
# events describe one hop and would silently under-report all of those.
#
# THE LOOP CLOSES ITSELF. A push to `staging` means QA has taken the work, so
# the issue closes. Nothing to tidy up by hand, and the next promotion opens a
# fresh one rather than appending to a stale thread.
name: Ready for QA

on:
  push:
    branches: [qa, staging]

# A promotion is often two pushes seconds apart. Without this they race and
# both try to create the issue. Never cancel in progress: the second push is
# the one with the complete range, so losing it would under-report.
concurrency:
  group: ready-for-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  announce:
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what is on qa but not yet on staging
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # staging may not exist on a fresh clone of this workflow; main is the
          # honest fallback since it is the only other branch QA has signed off.
          BASE=origin/staging
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=origin/main
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          git log --format=%s "$BASE..origin/qa" > /tmp/subjects.txt || true
          COUNT=$(wc -l < /tmp/subjects.txt | tr -d ' ')
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"

          # TWO MERGE SUBJECT FORMATS EXIST IN THIS REPO AND ONLY ONE WAS MATCHED.
          #
          #   Merge pull request #890 from JohnDominicJasmin/test/...   <- github's default
          #   Merge PR #891: restore the Arena handoff and the ...      <- gh pr merge --subject
          #
          # On 2026-09-06 the range staging..qa held nine merges. Six matched.
          # #891, #892 and #894 were absent from the Ready-for-QA issue entirely,
          # so QA was handed six "How to test" sections for nine PRs and had no
          # way to notice the other three - the issue said "6 PR(s)" and looked
          # complete. Nobody chose the second format; it is what
          # `gh pr merge --subject "Merge PR #N: ..."` produces.
          #
          # Anchored at ^ because %s is a subject line: a real merge subject starts
          # with Merge, and prose that happens to quote "Merge pull request #123"
          # should not register as a PR in the release.
          grep -oE '^Merge (pull request |PR )?#[0-9]+' /tmp/subjects.txt \
            | grep -oE '[0-9]+' | sort -u > /tmp/prs.txt || true
          echo "prs=$(wc -l < /tmp/prs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

          # RECONCILE, BECAUSE THE FAILURE MODE ABOVE WAS SILENCE.
          #
          # Broadening the pattern fixes the two formats we know about. It does
          # nothing for the third one someone invents later, and that miss would
          # look exactly like this one did: a smaller number, no error, an issue
          # that reads as complete.
          #
          # So count the merges independently of the pattern and carry any subject
          # the pattern did not claim. A merge commit is a merge commit whatever
          # its wording, and `--merges` does not care how it is phrased.
          git log --merges --format=%s "$BASE..origin/qa" > /tmp/merges.txt || true
          grep -vE '^Merge (pull request |PR )?#[0-9]+' /tmp/merges.txt > /tmp/unmatched.txt || true
          echo "unmatched=$(wc -l < /tmp/unmatched.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # ── WHAT qa IS ACTUALLY SERVING, read before anyone deploys this promotion ──
      #
      # `qa` does not auto-deploy, so the branch moving and the site changing are two separate
      # events. This records the gap at the moment of the announcement: if the commit below is
      # BEHIND the range this issue describes, the previous promotion was never deployed and QA
      # is about to test a build that does not contain it. That happened three times in one day
      # on 2026-08-09, and the only symptom was the site serving old code while every commit
      # said the fix had shipped.
      #
      # ── UNFAILABLE BY CONSTRUCTION, WHICH IS THE DESIGN CONSTRAINT, NOT A NICETY ────────
      #
      # This rides on the announcement. If it can fail it can cost QA the handoff it is
      # decorating - and `announce-failed` below would then open an issue saying the promotion
      # was not announced, which would be true and entirely this step's fault. So:
      #
      #   * no `set -e` - every command may fail on its own terms
      #   * `continue-on-error: true` as a second, independent layer
      #   * the variables START at UNREACHABLE and are only overwritten by a value that
      #     actually parsed, so a blank is not reachable from here
      #
      # THE FALLBACK MUST NOT BE ABLE TO SPEAK AS A MEASUREMENT. A `|| echo 0` on a check that
      # had errored has printed a reassuring "0 occurrences - good" in this project before, so
      # the failure value is a WORD: nobody reads UNREACHABLE as a commit, and nobody reads
      # NOT_IN_HISTORY as "up to date".
      #
      # 90s AND NOT 25s, because A SLEEPING SERVICE IS NOT AN UNREACHABLE ONE. qa is on the
      # free plan and sleeps when idle; `playwright.config.ts` already carries 90s as this
      # project's measured cold-start allowance. A short timeout would print UNREACHABLE for a
      # service that was merely asleep and perfectly healthy - a WRONG reading rather than a
      # missing one, which is the worse of the two and the one that gets quoted.
      - name: Snapshot what qa is serving
        id: deployed
        if: steps.pending.outputs.commits != '0'
        continue-on-error: true
        run: |
          COMMIT=UNREACHABLE
          BRANCH=UNREACHABLE
          BEHIND=UNREACHABLE

          BODY=$(curl -fsS --max-time 90 --retry 1 --retry-delay 5 \
            https://liquidity-hq-qa.onrender.com/api/version 2>/dev/null) || BODY=''

          if [ -n "$BODY" ]; then
            C=$(printf '%s' "$BODY" | jq -r '.commit // empty' 2>/dev/null) || C=''
            B=$(printf '%s' "$BODY" | jq -r '.branch // empty' 2>/dev/null) || B=''
            [ -n "$C" ] && COMMIT=$C
            [ -n "$B" ] && BRANCH=$B

            # How far the SERVED commit is behind the branch - the number that says whether a
            # deploy was skipped.
            #
            # NESTED, NOT `&&`-CHAINED, and a test caught the difference. Flattened as
            # `if [ "$COMMIT" != UNREACHABLE ] && git cat-file -e ...`, a 200 carrying
            # unparseable JSON fell into the else and reported NOT_IN_HISTORY - a claim about
            # the history of a commit that had never been read. BEHIND must stay UNREACHABLE
            # whenever COMMIT is UNREACHABLE: "I could not read it" and "I read it and it is
            # not in the history" are different findings and only one of them is about git.
            if [ "$COMMIT" != UNREACHABLE ]; then
              if git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
                N=$(git rev-list --count "${COMMIT}..origin/qa" 2>/dev/null) || N=''
                [ -n "$N" ] && BEHIND=$N
              else
                # A force-push, or a build from a branch since deleted.
                BEHIND=NOT_IN_HISTORY
              fi
            fi
          fi

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "qa is serving commit=$COMMIT branch=$BRANCH behind=$BEHIND"

      - name: Build the issue body
        if: steps.pending.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # THE SECOND HALF OF "no blanks". The step above cannot emit an empty value, but a
          # step that was SKIPPED or that `continue-on-error` swallowed has no outputs at all,
          # and an unset output renders as an empty string. These fallbacks mean the issue says
          # UNREACHABLE in that case too, rather than showing an empty line where a commit
          # should be - which is the one outcome that reads as "fine".
          SERVED_COMMIT: ${{ steps.deployed.outputs.commit || 'UNREACHABLE' }}
          SERVED_BRANCH: ${{ steps.deployed.outputs.branch || 'UNREACHABLE' }}
          SERVED_BEHIND: ${{ steps.deployed.outputs.behind || 'UNREACHABLE' }}
        run: |
          set -euo pipefail
          {
            echo "**Dev Team** -> **QA Team** (posted automatically on every promotion to \`qa\`)"
            echo
            echo "\`qa\` has moved. These are on \`qa\` and **not yet on \`staging\`** - so they are"
            echo "waiting for you to promote and test."
            echo
            echo "Promote with \`git checkout staging && git merge --ff-only qa\`, deploy"
            echo "\`liquidity-hq-staging\`, then open the \`staging\` -> \`main\` release PR."
            echo "**This issue closes itself** when \`staging\` moves."
            echo
          } > /tmp/body.md

          if [ -s /tmp/prs.txt ]; then
            echo "## What is waiting" >> /tmp/body.md
            echo >> /tmp/body.md
            while read -r N; do
              [ -n "$N" ] || continue
              TITLE=$(gh pr view "$N" --repo "$REPO" --json title --jq .title 2>/dev/null || echo "(could not read PR)")
              echo "### #$N — $TITLE" >> /tmp/body.md
              echo >> /tmp/body.md
              # Pull the PR's own "How to test (QA)" section through verbatim.
              # That section is the dev->QA handoff and it is otherwise buried in
              # a closed PR by the time the work reaches you.
              gh pr view "$N" --repo "$REPO" --json body --jq .body 2>/dev/null \
                | awk '/^#+ *How to test/{f=1; next} /^#+ /{if(f) exit} f' \
                | sed '/^[[:space:]]*$/d' > /tmp/howto.md || true
              if [ -s /tmp/howto.md ]; then
                cat /tmp/howto.md >> /tmp/body.md
              else
                echo "_No \"How to test (QA)\" section in that PR — ask dev before testing it._" >> /tmp/body.md
              fi
              echo >> /tmp/body.md
            done < /tmp/prs.txt
          fi

          # A merge this workflow could not attribute to a PR number. Listed
          # rather than dropped: an unrecognised subject format is the one case
          # where a smaller PR count is indistinguishable from a smaller release.
          if [ -s /tmp/unmatched.txt ]; then
            {
              echo "## Merges with no PR number this workflow could read"
              echo
              echo "**These are in the range and have no \"How to test\" above.**"
              echo "Test them from the commits, and say so, rather than assuming"
              echo "the section above is the whole promotion."
              echo
              sed 's/^/- /' /tmp/unmatched.txt
              echo
            } >> /tmp/body.md
          fi

          # Commits that arrived without a PR are the ones most worth surfacing:
          # nothing else records them anywhere QA would look.
          if ! [ -s /tmp/prs.txt ]; then
            echo "## Commits on \`qa\` (no merge commits found — direct pushes?)" >> /tmp/body.md
            echo >> /tmp/body.md
            sed 's/^/- /' /tmp/subjects.txt >> /tmp/body.md
            echo >> /tmp/body.md
          fi

          {
            echo "---"
            echo
            echo "Range: \`${{ steps.pending.outputs.base }}..origin/qa\` — "
            echo "${{ steps.pending.outputs.commits }} commit(s), ${{ steps.pending.outputs.prs }} PR(s),"
            echo "${{ steps.pending.outputs.unmatched }} merge(s) with no readable PR number."
            echo "Computed from the branch range rather than the push event, so it stays"
            echo "correct across force-pushes, re-runs and several promotions in a row."
          } >> /tmp/body.md

          # WHAT THE SITE IS SERVING, which is a different question from what the branch says.
          # Quoted rather than summarised: `/api/version` reports the RUNNING build, and this
          # project's standing rule is to quote it rather than the branch.
          {
            echo
            echo "**What \`liquidity-hq-qa\` is serving right now:** \`$SERVED_COMMIT\`"
            echo "on branch \`$SERVED_BRANCH\`."
          } >> /tmp/body.md

          # Three outcomes, and each gets its own sentence, because "0" and "could not tell"
          # must never read the same way.
          if [ "$SERVED_BEHIND" = UNREACHABLE ]; then
            {
              echo
              echo "> The deployed commit could **not be read** - no answer from \`/api/version\`"
              echo "> within 90s. This is a MISSING MEASUREMENT, not a sign that anything is wrong:"
              echo "> the service is on the free plan and may have been asleep. **Check it yourself"
              echo "> before deploying** rather than treating this line as a result."
            } >> /tmp/body.md
          elif [ "$SERVED_BEHIND" = NOT_IN_HISTORY ]; then
            {
              echo
              echo "> The deployed commit is **not in this clone's history of \`origin/qa\`**, so how"
              echo "> far behind it is cannot be stated. That happens after a force-push, or when the"
              echo "> running build came from a branch since deleted. Worth a look before you deploy."
            } >> /tmp/body.md
          elif [ "$SERVED_BEHIND" = "0" ]; then
            {
              echo
              echo "> Already serving the tip of \`qa\`, so **this promotion is deployed** and the"
              echo "> list above is live on the site."
            } >> /tmp/body.md
          else
            {
              echo
              echo "> **This promotion is NOT deployed yet** - the site is **$SERVED_BEHIND commit(s)"
              echo "> behind \`qa\`**. Deploy \`liquidity-hq-qa\` before testing, or you will be testing"
              echo "> a build that does not contain the work listed above. If that number is larger"
              echo "> than this promotion, an EARLIER one was never deployed either."
            } >> /tmp/body.md
          fi

      - name: Open or update the Ready-for-QA issue
        if: steps.pending.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create ready-for-qa --repo "$REPO" --color 0E8A16 \
            --description "Work is on qa and waiting for QA to promote and test" 2>/dev/null || true

          TITLE="Ready for QA: ${{ steps.pending.outputs.prs }} PR(s) on \`qa\` awaiting promotion"
          EXISTING=$(gh issue list --repo "$REPO" --label ready-for-qa --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            # Edit rather than comment: the issue should always show the CURRENT
            # pending set, not a pile of superseded snapshots.
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file /tmp/body.md
            gh issue comment "$EXISTING" --repo "$REPO" \
              --body "\`qa\` moved again — the list above now reflects everything still waiting."
            echo "updated #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/body.md --label ready-for-qa
          fi

  close:
    # staging moving means QA has taken the work.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Close the Ready-for-QA issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tolerate the label not existing yet: `gh issue list --label` errors
          # on an unknown label, and staging can legitimately move before the
          # first promotion ever created one. Nothing to close in that case.
          OPEN=$(gh issue list --repo "$REPO" --label ready-for-qa --state open \
                   --json number --jq '.[].number' 2>/dev/null || true)
          for N in $OPEN; do
            gh issue close "$N" --repo "$REPO" \
              --comment "\`staging\` has moved — QA has taken this work. Closing automatically. The next promotion to \`qa\` opens a fresh one."
          done

  # ── If the announcement itself fails, say so LOUDLY ────────────────────────
  #
  # The whole point of this workflow is that a promotion cannot go unannounced.
  # Without this job, a failure in `announce` leaves `qa` moved and NOTHING
  # telling QA - which is the exact failure it exists to prevent, one level up.
  #
  # That is not hypothetical. `release-signals.yml` failed on its first real run
  # (issue #99): the promotion succeeded, the ready-for-QA issue closed
  # correctly, and no release PR appeared. Nothing announced the failure. QA
  # found it by going to look for a PR that was not there.
  #
  # WHY THIS CANNOT FAIL THE SAME WAY. The primary path calls `gh issue
  # create`/`edit`, which needs `issues: write` - declared at the top of this
  # file and exercised on every run since. The thing that broke release-signals
  # was `gh pr create`, which needs a REPO SETTING ("Allow GitHub Actions to
  # create and approve pull requests") that was off for the entire life of that
  # workflow. This job opens an issue, so it depends only on a permission the
  # workflow already holds and has already used.
  #
  # `if: failure()` runs when a needed job failed. It does not run if the
  # workflow never starts at all - a YAML parse error or a runner outage is
  # still silent, and nothing inside a workflow can cover that case.
  announce-failed:
    needs: announce
    if: failure() && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open an issue saying the promotion was not announced
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          BASE=origin/staging
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=origin/main

          {
            echo "**Automated** - the Ready-for-QA announcement failed, so this promotion"
            echo "was not announced by the usual route."
            echo
            echo "\`qa\` is at \`$(git rev-parse --short=7 origin/qa)\` and has moved."
            echo "**Treat this as the notification** and check the range by hand."
            echo
            echo "Failed run: $RUN"
            echo
            echo "## What is on \`qa\` and not on \`staging\`"
            echo
            echo '```'
            git log --format='%h %s' "$BASE..origin/qa" 2>/dev/null | head -40 || echo "(range unavailable)"
            echo '```'
            echo
            echo "This issue is a fallback, so it is deliberately cruder than the real one -"
            echo "no per-PR \"How to test\" sections. Fix the workflow, then re-push \`qa\` to"
            echo "regenerate the proper list."
          } > /tmp/fail.md

          gh label create announcement-failed --repo "$REPO" --color D93F0B \
            --description "A promotion happened but the automated announcement did not" 2>/dev/null || true

          gh issue create --repo "$REPO" --label announcement-failed \
            --title "Promotion to \`qa\` was NOT announced - ready-for-qa.yml failed" \
            --body-file /tmp/fail.md
