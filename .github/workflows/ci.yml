name: CI

on:
  # qa is the branch QA tests against, so a broken merge into it costs QA a
  # wasted test run and a false bug report before anyone looks at CI. Checking
  # it here is cheaper than that. Note the qa Render service does NOT
  # auto-deploy - a merge into qa is not live until someone triggers it - so
  # this is a gate on the branch, not a last line of defence before users.
  push:
    branches: [dev, qa, main]
  # Also on PRs, or CI only ever runs AFTER a merge - which is the one moment
  # it cannot help. The convention makes the PR the review point (CONTRIBUTING
  # section 4), so the checks have to be green before the merge button, not
  # after. Covers PRs from any branch, including QA-authored ones, which a
  # push trigger limited to [dev, main] never sees.
  pull_request:
    branches: [dev, qa, main]

jobs:
  build:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nothing in this repo was linted before 2026-08-03. Next 16 removed the
      # `next lint` command AND stopped `next build` from linting, so a green
      # build had said nothing about lint for the whole of this project's life.
      # Runs first because it is the fastest of the four steps.
      #
      # Fails on errors only. Warnings are printed but do not block - there are
      # 93 of them, a pre-existing React Compiler backlog documented in
      # eslint.config.mjs. Deliberately no --max-warnings=0: it would either
      # force a 67-file refactor of live code today, or be set to a number
      # nobody maintains.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The suite existed but nothing ran it, so a green CI said nothing about
      # whether the tested behaviour still held. Runs before the build: a unit
      # failure should be reported as a unit failure, not buried behind a
      # several-minute build.
      #
      # Worth being honest about the limits - this would NOT have caught the
      # news-dedup regression of 2026-08-03, because that test passed while
      # asserting the wrong behaviour. Running tests catches breakage of what
      # they claim; it cannot catch a claim that was wrong to begin with.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # A full run is ~31 minutes. Without a cap, a genuinely hung run burns to
    # GitHub's 6-hour default, and a stuck run looks identical to a slow one -
    # which happened while this suite was being brought up. 45 leaves headroom
    # for a cold runner without hiding a hang.
    timeout-minutes: 45
    # Only after lint/typecheck/unit/build are green. A broken build would
    # produce 216 browser failures that all say "the build is broken", which
    # buries the one line that actually explains it.
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only. Firefox and WebKit roughly triple install time, and this
      # app ships as a Chromium-based PWA plus a Capacitor Android shell, so
      # neither engine reflects a real user.
      #
      # Note playwright.config.ts pins `browserName: 'chromium'` on the mobile
      # project. devices['iPhone 13'] defaults to WebKit, and without that pin
      # every mobile test fails here with "Executable doesn't exist at
      # .../webkit-2336" - which is what happened the first time this suite ran.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer runs `npm run build && npm start` on
      # port 3100, so CI and local exercise the same production build.
      #
      # The NEXT_PUBLIC_* vars are inlined AT BUILD TIME, which is why they are
      # set on this step rather than only at run time. Without them AuthProvider
      # builds no Supabase client, /login never renders its form, and
      # /api/ops/* throws "supabaseUrl is required" and answers 500 instead of
      # the 401 the security specs assert.
      #
      # These point at the DEV Supabase project, never prod, and carry the anon
      # key only - never the service-role key. The anon key is public by design
      # and the dev project holds no real user data.
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.E2E_TURNSTILE_SITE_KEY }}

          # Selects the lhq_dev_ table prefix. NOT optional, and not a nicety:
          # lib/tables.ts reads
          #     NEXT_PUBLIC_APP_ENV === 'dev' ? 'lhq_dev_' : 'lhq_'
          # so anything that is not exactly 'dev' - INCLUDING undefined, which is
          # what CI had - selects the PRODUCTION table names. CI then queried
          # lhq_hypotheses / lhq_price_alerts against the dev project, which has
          # neither (only lhq_dev_* exist there, plus lhq_signup_ip_log). Every
          # such query errored and apiError mapped it to a 500.
          #
          # That is why bola.spec.ts saw GET /api/hypotheses return 500 to
          # account A for A's OWN rows - nothing to do with authorization. It
          # also means every authenticated CI run before this line existed was
          # querying tables that were not there, so those runs asserted less
          # than they appeared to.
          #
          # Belongs in THIS step, not the build step: NEXT_PUBLIC_* is inlined at
          # build time, and playwright.config.ts's webServer runs
          # `npm run build && npm start` as a child of this step, inheriting env.
          NEXT_PUBLIC_APP_ENV: dev

          # Authenticated fixtures for qa/e2e/bola.spec.ts - BOLA/IDOR, the one
          # spec that signs in. Two seeded accounts on the DEV Supabase project
          # only. A holds one row per table under test; B is deliberately empty,
          # because the test is "B asks for A's rows by id and must be refused".
          #
          # Passwords rather than tokens on purpose: a Supabase access token
          # expires in about an hour, so a pasted token passes once and then
          # fails CI the next day. The spec mints a fresh token per run.
          #
          # These are ordinary user-level accounts. The service-role key is NOT
          # here and must never be - it bypasses RLS entirely, which is exactly
          # what this spec exists to verify.
          #
          # Absent, bola.spec.ts SKIPS with a stated reason rather than passing.
          # A BOLA test that runs without fixtures proves nothing, and a vacuous
          # pass is indistinguishable from a real one.
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_A_ID: ${{ secrets.E2E_USER_A_ID }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          E2E_USER_B_ID: ${{ secrets.E2E_USER_B_ID }}
          E2E_A_TRADE_ID: ${{ secrets.E2E_A_TRADE_ID }}
          E2E_A_HYPOTHESIS_ID: ${{ secrets.E2E_A_HYPOTHESIS_ID }}
          E2E_A_PRICE_ALERT_ID: ${{ secrets.E2E_A_PRICE_ALERT_ID }}

      # Uploaded on failure too - that is the run you actually need to read.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: qa/e2e-report/
          retention-days: 14
