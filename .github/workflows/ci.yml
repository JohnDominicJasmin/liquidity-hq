name: CI

# ─────────────────────────────────────────────────────────────────────────────
# WHERE THE BROWSER SUITE RUNS. Read this before adding a trigger.
#
# Aug 3-5 2026 burned 1,755 Actions minutes in three days on a private repo with
# a 2,000 min/month allowance - roughly $124/month annualised, and it hard-
# stopped CI mid-release when the spending limit was hit.
#
# The rule now: the ~2 minute job runs on everything. The ~53 minute Playwright
# suite runs on exactly ONE automatic trigger - a PR into `main`, which is the
# release, immediately before a production deploy.
#
# THE BRANCH FLOW IS FOUR-STAGE as of 2026-08-07:
#
#   dev  ->  qa  ->  staging  ->  main
#    |        |         |           |
#    |        |         |           production
#    |        |         release candidate: approved work PARKS here and
#    |        |         combines into one batch. No deployment of its own.
#    |        where QA tests and signs off
#    integration
#
# `staging` exists because `qa` was doing two jobs at once - rolling integration
# AND release candidate. Since the release PR's head IS its base branch, every
# promotion grew a release QA had already signed off. That happened three times
# on 2026-08-06 alone. Putting the candidate on its own branch is the fix.
#
# Precisely: this is SINGLE-OWNER, not immutable. `staging` can still move, but
# only QA can move it. The rule the branches cannot enforce - do not promote
# qa -> staging while a staging -> main PR is open - is in CONTRIBUTING 6.
#
# The e2e condition below did not need changing for this: the release PR is now
# `staging -> main` rather than `qa -> main`, and `base_ref` is `main` either way.
#
# NOBODY runs it by hand - not dev, not QA. An earlier draft had QA running it
# locally on the dev -> qa PR; that was dropped because ordering it correctly
# (manual testing first, suite last) put it minutes before this run, on the same
# commit, differing only in environment. Between the two, keep the stricter one
# that costs nobody an afternoon. See CONTRIBUTING section 4b.
#
# Why THIS run is the stricter one: it is the only place the app builds WITHOUT
# developer env, and that difference has produced two real defects - the labels
# bug (only reproduces when /api/labels returns {}, which never happens on a
# machine with .env.local present) and the NEXT_PUBLIC_APP_ENV table-prefix gap.
# ~136 min/month for the last automated check before production.
#
# What is given up, stated so nobody is surprised: between a feature merging
# into dev and the release PR opening, nothing exercises a browser. A regression
# surfaces here, with the whole batch attached, rather than on the PR that caused
# it. Bounded by the weekly release cadence in CONTRIBUTING section 7a.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # The PR is the review point (CONTRIBUTING section 4), so the gate has to be
  # here - CI that only runs after a merge runs at the one moment it cannot
  # help. `types` is explicit so a label or a title edit can never spend 34
  # minutes; `synchronize` is the one that fires on each push to an open PR.
  pull_request:
    branches: [dev, qa, staging, main]
    types: [opened, reopened, synchronize, ready_for_review]

  push:
    # `qa` is deliberately ABSENT. CONTRIBUTING section 6 makes every promotion
    # fast-forward only, so the commit landing on it is bit-identical to one
    # already tested on dev.
    #
    # `staging` WAS absent for the same reason, and was added 2026-08-10 because
    # the reason turned out not to cover the browser suite. See the e2e job's
    # `if:` below - the argument was about the 2-minute job, and the 38-minute
    # one was reaching `staging` through a release PR that has since stopped
    # being opened. Issue #207.
    branches: [dev, staging, main]
    # Docs-only pushes do not need a build. Every path here is either not
    # compiled or not shipped, so a run over them proves nothing that the
    # PR-side run had not already proved.
    #
    # DELIBERATELY ON `push` ONLY, not on `pull_request`, and the reason matters
    # more than the saving:
    #
    #   - `main` is the only branch with a required status check (`CI Gate`).
    #     Required checks are evaluated on the PULL REQUEST. A required check
    #     that never runs never reports, and GitHub treats "never reported" as
    #     pending forever - so a docs-only release PR would be unmergeable with
    #     no way to force it short of an admin override. That is a worse failure
    #     than the minutes are worth.
    #   - The alternative - keep the workflow running and skip the expensive
    #     jobs with an `if:` - is worse still. The `gate` job below rests on
    #     "build carries no `if:`, so anything other than success is real".
    #     Teaching it to accept `skipped` reopens the hole it was hardened to
    #     close after release PR #38, where a skipped job read as a green
    #     required check.
    #
    # So: pushes skip, pull requests always run. Issue #114 sibling item.
    #
    # ── WHAT IS DELIBERATELY *NOT* ON THIS LIST ────────────────────────────
    # QA's wording from the duplicate PR #115, kept because it is the better
    # argument and because this is the line someone will be tempted to edit:
    #
    #   `qa/**` and `.github/**` are deliberately NOT in the ignore list. Test
    #   code and workflow definitions are exactly the things that need CI to
    #   run; excluding them is how a broken spec or a broken workflow ships
    #   without anyone noticing.
    #
    # Adding them roughly TRIPLES the saving, which is precisely why it looks
    # attractive - and it removes the gate from the QA suite while doing it.
    # The two `.github/` entries below are individual files that cannot affect a
    # build; the directory as a whole stays covered.
    #
    # Sized honestly so nobody re-litigates it expecting more: only **1 of 31**
    # recent commits touches documentation alone, so this saves ~60 min/month.
    # QA's first count was 7 of 21 and included `.github/` and `qa/` changes;
    # filtering to true documentation left one in thirty-one. It is worth doing
    # because it is correct and free, not because it moves the number. The item
    # that moves the number is `workers: 1` - issue #114.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'pendings/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'

  # For running the browser suite on demand: re-checking after a flake, or
  # proving a fix without opening a release PR first.
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the full browser suite
        type: boolean
        default: true
      # DISPATCH-ONLY, and off by default. This changes what the run measures,
      # so it must never be the thing that happens on an ordinary push.
      #
      # #114 wants `workers` above 2. The blocker is not the theory - a local
      # run at 2 produced zero 429s - it is that rate limits are PER IP and the
      # only measurement anyone has is from one developer machine. A clean local
      # number proves the volume is low; it does not prove GitHub's shared
      # egress is under the threshold, and that is the IP that would get banned.
      #
      # count mode passes every call through untouched and only tallies it, so a
      # run with this on is exactly as valid as one without. It answers the one
      # question #114 has been stuck on since it was filed.
      count_egress:
        description: 'Tally outbound third-party calls (does not change behaviour; artifact: egress-tally)'
        type: boolean
        default: false

# Without this, every push to a PR stacked another run and the superseded one
# carried on to completion. Nothing was ever cancelled. Costs no coverage.
#
# event_name is in the group so a dispatch and a push never share a lane.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  # PRs and dev cancel freely - only the tip matters. main NEVER cancels
  # mid-flight; a second push queues behind the first. On a pull_request event
  # ref_name is "33/merge", not a branch, so the dev comparison cannot
  # false-positive there.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name == 'dev' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    # Had no cap at all, so a hung npm ci billed toward GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nothing in this repo was linted before 2026-08-03. Next 16 removed the
      # `next lint` command AND stopped `next build` from linting, so a green
      # build had said nothing about lint for the whole of this project's life.
      # Runs first because it is the fastest of the four steps.
      #
      # Fails on errors only. Warnings are printed but do not block - there are
      # 94 of them, a pre-existing React Compiler backlog documented in
      # eslint.config.mjs. Deliberately no --max-warnings=0: it would either
      # force a 67-file refactor of live code today, or be set to a number
      # nobody maintains.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The suite existed but nothing ran it, so a green CI said nothing about
      # whether the tested behaviour still held. Runs before the build: a unit
      # failure should be reported as a unit failure, not buried behind a
      # several-minute build.
      #
      # Worth being honest about the limits - this would NOT have caught the
      # news-dedup regression of 2026-08-03, because that test passed while
      # asserting the wrong behaviour. Running tests catches breakage of what
      # they claim; it cannot catch a claim that was wrong to begin with.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Only after lint/typecheck/unit/build are green. A broken build would
    # produce 216 browser failures that all say "the build is broken", which
    # buries the one line that actually explains it.
    needs: build
    # THE COST DECISION, in one expression. A PR into `main` is the release, and
    # the production deploy is the next manual step after it merges. Nothing
    # else triggers this automatically.
    #
    # base_ref, not ref_name - on a pull_request event ref_name is "33/merge".
    # base_ref is empty on push and on dispatch, so both fall through.
    #
    # PRs into `dev`, `qa` and `staging` deliberately get the 2-minute job only.
    # The release PR is `staging -> main`, so `base_ref == 'main'` still selects
    # exactly one gate after the four-branch change. See CONTRIBUTING 4b.
    #
    # ── PUSH TO `staging` ADDED 2026-08-10. Issue #207. ────────────────────────
    #
    # The release PR was the ONLY automatic trigger, and it stopped being opened:
    # `RELEASE_PR_PAUSED` was set on the owner's "park it, do not ship" call, and
    # `release-signals.yml` opens nothing while it is on. Both decisions were
    # correct. Together they meant **the browser suite did not run at all** -
    # measured across 60 consecutive CI runs, where the only completed E2E jobs
    # were two manual dispatches.
    #
    # `smoke`, `cache-policy` and `cache-effective` were still covered, because QA
    # runs those against the deployed services. `perf`, `a11y`, `a11y-auth`,
    # `bola`, `contrast`, `i18n`, `layout`, `clock`, `payments-webhook` and
    # `checkout` were covered NOWHERE.
    #
    # WHY `staging` AND NOT `qa`, which is where I first proposed it. `qa` moves
    # several times a day, so at ~38 min a run that is roughly 760 min/month
    # against a 2,000 min allowance - it would have re-created the overspend #114
    # exists to fix. `staging` moves only when QA promotes a verified batch, a
    # few times a week, so it costs ~190 min/month. Close to the ~136 the release
    # PR used to cost, and it lands on the release candidate itself, which is
    # exactly what the gate was for.
    #
    # THE DOUBLE-BILLING CASE, named rather than discovered: if a `staging ->
    # main` PR is open, an ff-push to `staging` fires this push trigger AND
    # `synchronize` on that PR - two full runs for one promotion. CONTRIBUTING 6
    # already forbids promoting into `staging` while a release PR is open, so in
    # the intended flow it cannot happen. It is accepted rather than guarded
    # because the guard would have to ask GitHub whether a PR exists, and a
    # gate that can be disabled by an API hiccup is worse than a rare duplicate.
    if: >-
      github.base_ref == 'main' ||
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.e2e)
    # Without a cap, a genuinely hung run burns to GitHub's 6-hour default, and
    # a stuck run looks identical to a slow one - which happened while this
    # suite was being brought up. So the cap stays; the number moved.
    #
    # 45 -> 90 on 2026-08-07. 45 was sized when a full run was ~31 minutes.
    # qa/e2e/contrast.spec.ts then added ~11 minutes of genuine coverage - two
    # sweeps of 32 routes, which is what found the 990-violation light theme
    # defect - taking a local full run to ~46. In CI the job was cancelled at
    # 45.3 minutes, which read as a release failure when it was the cap being
    # too small for the suite it now guards.
    #
    # Raised rather than made faster, because the obvious speed-up is not
    # available: playwright.config.ts pins `workers: 1` on purpose, since
    # parallel specs multiply Binance/Bybit traffic and trip the app's own
    # per-IP rate limiter into 429s that look like product bugs. Parallelising
    # the contrast file was tried and changed nothing for exactly that reason.
    #
    # 90 -> 120, same day, because 90 was set from LOCAL timings and CI is much
    # slower. Measured from the cancelled run's own log rather than estimated:
    #
    #   contrast.spec.ts   11.6m local   ->   18.6m in CI    (1.6x)
    #
    # At the 45-minute cut-off that run had reached test 95 of ~249 and had not
    # started the mobile project at all, which is the slower half. Extrapolated,
    # a full CI run is ~80-90 minutes - so 90 would have been a cap the suite
    # lands exactly on, and the next release would have failed the same way for
    # the same reason. 120 leaves real headroom instead of nominal headroom.
    #
    # Where the time goes, measured per route rather than guessed: the sweep
    # waits for `networkidle` on every page, which costs ~8s on almost every
    # route - 8.1 minutes across the 58 loads contrast.spec.ts does. Only ONE
    # route (/login, whose Turnstile widget never settles) actually hits the 30s
    # timeout, so this is a steady tax and not a pathological case.
    #
    # That 8 minutes is recoverable by replacing the idle wait with a bounded
    # settle, and it is deliberately NOT done here. Measuring a page before it
    # has finished rendering silently under-counts violations, which reads as an
    # improvement and ratchets a baseline down onto a number that was never
    # true. That change needs a "did it actually render" guard and its own
    # verification - not a slot on the critical path of a blocked release.
    #
    # If the suite grows again, move this WITH the change that grows it, and
    # size it from a CI measurement rather than a local one.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only. Firefox and WebKit roughly triple install time, and this
      # app ships as a Chromium-based PWA plus a Capacitor Android shell, so
      # neither engine reflects a real user.
      #
      # Note playwright.config.ts pins `browserName: 'chromium'` on the mobile
      # project. devices['iPhone 13'] defaults to WebKit, and without that pin
      # every mobile test fails here with "Executable doesn't exist at
      # .../webkit-2336" - which is what happened the first time this suite ran.
      #
      # Cached on the Playwright VERSION, not the lockfile hash: a dependency
      # bump elsewhere should not evict a 120MB browser download that was
      # otherwise re-fetched on every single run.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser binary is cached but its apt system libraries are not -
      # those live outside ~/.cache. ~5s.
      - name: Install Chromium system deps
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts's webServer runs `npm run build && npm start` on
      # port 3100, so CI and local exercise the same production build.
      #
      # The NEXT_PUBLIC_* vars are inlined AT BUILD TIME, which is why they are
      # set on this step rather than only at run time. Without them AuthProvider
      # builds no Supabase client, /login never renders its form, and
      # /api/ops/* throws "supabaseUrl is required" and answers 500 instead of
      # the 401 the security specs assert.
      #
      # These point at the DEV Supabase project, never prod, and carry the anon
      # key only - never the service-role key. The anon key is public by design
      # and the dev project holds no real user data.
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: true

          # ── EGRESS COUNTING, dispatch-only and off unless asked for ────────
          #
          # Empty on every ordinary run, so the preload is not loaded at all and
          # this step behaves exactly as it did before.
          #
          # NODE_OPTIONS applies to EVERY node process in the tree, including the
          # `npm` wrapper and the `npm run build` that playwright.config.ts's
          # webServer runs as a child. That is intended - build-time fetches are
          # real egress from this IP and belong in the tally - but it is also why
          # qa/server-intercept.mjs writes exclusively to stderr: npm parses its
          # own stdout while resolving npm-prefix.js, and one console.log there
          # stopped the server from starting at all.
          NODE_OPTIONS: ${{ (github.event_name == 'workflow_dispatch' && inputs.count_egress) && '--import ./qa/server-intercept.mjs' || '' }}
          QA_INTERCEPT_UPSTREAM: ${{ (github.event_name == 'workflow_dispatch' && inputs.count_egress) && 'count' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.E2E_TURNSTILE_SITE_KEY }}

          # Selects the lhq_dev_ table prefix. NOT optional, and not a nicety:
          # lib/tables.ts reads
          #     NEXT_PUBLIC_APP_ENV === 'dev' ? 'lhq_dev_' : 'lhq_'
          # so anything that is not exactly 'dev' - INCLUDING undefined, which is
          # what CI had - selects the PRODUCTION table names. CI then queried
          # lhq_hypotheses / lhq_price_alerts against the dev project, which has
          # neither (only lhq_dev_* exist there, plus lhq_signup_ip_log). Every
          # such query errored and apiError mapped it to a 500.
          #
          # That is why bola.spec.ts saw GET /api/hypotheses return 500 to
          # account A for A's OWN rows - nothing to do with authorization. It
          # also means every authenticated CI run before this line existed was
          # querying tables that were not there, so those runs asserted less
          # than they appeared to.
          #
          # Belongs in THIS step, not the build step: NEXT_PUBLIC_* is inlined at
          # build time, and playwright.config.ts's webServer runs
          # `npm run build && npm start` as a child of this step, inheriting env.
          NEXT_PUBLIC_APP_ENV: dev

          # Authenticated fixtures for qa/e2e/bola.spec.ts - BOLA/IDOR, the one
          # spec that signs in. Two seeded accounts on the DEV Supabase project
          # only. A holds one row per table under test; B is deliberately empty,
          # because the test is "B asks for A's rows by id and must be refused".
          #
          # Passwords rather than tokens on purpose: a Supabase access token
          # expires in about an hour, so a pasted token passes once and then
          # fails CI the next day. The spec mints a fresh token per run.
          #
          # These are ordinary user-level accounts, and bola.spec.ts must keep
          # using them. It exists to prove RLS refuses B's request for A's rows;
          # signing in as the service role would bypass RLS and make it pass
          # while proving nothing. See the SUPABASE_SERVICE_ROLE_KEY block below
          # for why the key being present on the job does not change that.
          #
          # Absent, bola.spec.ts SKIPS with a stated reason rather than passing.
          # A BOLA test that runs without fixtures proves nothing, and a vacuous
          # pass is indistinguishable from a real one.
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_A_ID: ${{ secrets.E2E_USER_A_ID }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          E2E_USER_B_ID: ${{ secrets.E2E_USER_B_ID }}
          E2E_A_TRADE_ID: ${{ secrets.E2E_A_TRADE_ID }}
          E2E_A_HYPOTHESIS_ID: ${{ secrets.E2E_A_HYPOTHESIS_ID }}
          # A VARIABLE, not a secret, and deliberately. lhq_dev_price_alerts
          # uses an integer primary key where trades and hypotheses use UUIDs,
          # and this fixture is the only row in the table - so the value is the
          # literal string "1".
          #
          # GitHub redacts every occurrence of a secret's value anywhere in a
          # log. As a secret, this one turned EVERY literal 1 in CI output into
          # ***: "SC 1.4.3" printed as "SC ***.4.3" and a "2.20:1" contrast
          # ratio as "2.20:***". QA lost time reading a contrast failure through
          # that on 2026-08-08 (issue #107).
          #
          # It was never sensitive - it is a row id in the dev database, created
          # alongside genuinely secret things and classified with them by
          # proximity rather than by need. As a variable it prints normally.
          #
          # If a future fixture id is genuinely sensitive, make it a secret AND
          # give it a value that cannot collide with ordinary text.
          E2E_A_PRICE_ALERT_ID: ${{ vars.E2E_A_PRICE_ALERT_ID }}
          # B's own price alert, seeded 2026-08-08. A variable for the same
          # reason as A's, and it is `2` - a second single digit, so as a secret
          # it would redact every literal 2 in the log exactly as `1` did.
          #
          # It exists because the BOLA test stopped testing BOLA. price-alerts
          # checks entitlement at route.ts:89 and ownership at :111, so once B
          # was pinned to `free` the Pro gate refused it twenty lines before
          # ownership was reached - the test passed and proved nothing. The
          # cross-account attempt now runs as A, who is Pro, against a row A
          # does not own.
          E2E_B_PRICE_ALERT_ID: ${{ vars.E2E_B_PRICE_ALERT_ID }}

          # NOT a real credential, and it must never be one. The webhook spec
          # signs its own payloads with HMAC-SHA256 and the server verifies with
          # the same value, so the two only have to MATCH - any string works.
          #
          # Written literally rather than stored as a secret, deliberately:
          #   - it protects nothing. No LemonSqueezy store knows this value, so
          #     leaking it grants nobody anything.
          #   - as a secret it would be redacted from logs, and a signature
          #     mismatch is diagnosed by reading them.
          #   - the reader needs to know at a glance that it is fake. A masked
          #     value invites someone to "fix" it by pasting the real one in.
          #
          # The production secret lives only in Render's environment for
          # `liquidity-hq-prod`. Copying it here would let anyone who can read
          # this repository forge a webhook that grants Pro.
          LEMONSQUEEZY_WEBHOOK_SECRET: ci-fake-not-a-real-lemonsqueezy-secret

          # Same reasoning as the secret above, and the same deliberate fakeness.
          # `qa/e2e/checkout.spec.ts` needs a checkout URL to exist so it can
          # assert the button hands off the signed-in user's OWN id - the value
          # the webhook then refuses to trust. It INTERCEPTS and ABORTS the
          # navigation, so this host is never contacted.
          #
          # NEXT_PUBLIC_*, so it is inlined at BUILD time - it has to be on this
          # step because playwright.config.ts's webServer runs `npm run build`
          # as a child of it. Absent, getCheckoutUrl returns the signup fallback
          # and the spec fails loudly rather than asserting the unconfigured path
          # while claiming to test checkout.
          #
          # The real store URL belongs in Render's env for liquidity-hq-prod and
          # nowhere else.
          NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL: https://example.lemonsqueezy.com/checkout/buy/ci-fake-not-a-real-store

          # ── THIS FILE USED TO SAY THE SERVICE-ROLE KEY "must never be" HERE ──
          #
          # Reversed 2026-08-09 by an explicit owner decision, and written out
          # rather than quietly deleted: an absolute rule that softens with no
          # record is how the next person re-derives the wrong conclusion.
          #
          # WHAT THE OLD RULE COST. Three Pro-gated surfaces were verified by
          # nothing at all, because every one of them authenticates through
          # `getSupabaseAdmin()` and so errored before reaching the branch under
          # test:
          #
          #   1. the payments OWNERSHIP check - the payer supplies `user_id` in
          #      `custom_data`, which `lib/checkout.ts` writes into a
          #      client-side URL. Whether a payer can grant Pro to an account
          #      they do not own is the BOLA of payments, and it had never run.
          #   2. the payments REPLAY guard (`ls_webhook_events`).
          #   3. `/api/push/test`'s Pro gate - excluded from entitlements.spec.ts
          #      for this exact reason.
          #
          # WHY IT IS ACCEPTABLE. The two arguments the old rule rested on both
          # survive:
          #
          #   * "CI builds without developer env, which caught two real defects"
          #     - those were the labels bug and the NEXT_PUBLIC_APP_ENV prefix
          #     gap, and both are about a variable being ABSENT in CI while
          #     PRESENT in production. This key is present in production. Adding
          #     it moves CI toward the production configuration, not away from
          #     it. The env-absence guard is unaffected.
          #   * "it bypasses RLS, which bola.spec.ts exists to verify" - true of
          #     a TEST that authenticates with it. No spec does; bola.spec.ts
          #     signs in as A and B with passwords. What changes here is only
          #     that the SERVER can build its admin client, exactly as the
          #     server does in production.
          #
          # BLAST RADIUS, stated rather than assumed: this is the DEV project's
          # key. That project holds nine test accounts and no real user data,
          # and `staging` shares it. It is NOT prod's key and must never be -
          # prod's holds real customers and the free plan has no backups.
          #
          # IF THE SECRET IS ABSENT the three tests SKIP with a stated reason
          # rather than pass. That is deliberate and it is the part to preserve:
          # a skip is legible, a vacuous pass is not.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}

      # failure() only. This used to upload on every green run too - ~15s and
      # storage for a report nobody opens. failure() still excludes
      # cancellations, so a concurrency-cancelled run uploads nothing.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: qa/e2e-report/
          retention-days: 14

      # always(), NOT success(). The number is most interesting precisely when
      # the run went badly - a suite that tripped a rate limit is the case #114
      # needs to see, and that run fails.
      #
      # The file is written DURING the run, once a second, so it survives the
      # webServer being killed. `process.on('exit')` does not fire on a kill,
      # which is how the first attempt at this measurement produced a tally of
      # zero calls to Binance while /api/funding alone was making three.
      - name: Upload egress tally
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.count_egress }}
        uses: actions/upload-artifact@v4
        with:
          name: egress-tally-${{ github.run_attempt }}
          path: qa/.intercept-tally.json
          retention-days: 30
          if-no-files-found: warn

      # Printed as well as uploaded: #114 is answered by one number, and making
      # someone download an artifact to read it is how a measurement stops being
      # consulted.
      - name: Summarise egress
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.count_egress }}
        run: |
          if [ ! -f qa/.intercept-tally.json ]; then
            echo "No tally written. The preload did not load, or no outbound call was made." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # grep, not require() - playwright.config.ts is TypeScript and node
          # cannot load it here. The number is what the tally must be read
          # against: N calls at 2 workers says nothing about 4 on its own.
          WORKERS=$(grep -oE '^\s*workers:\s*[0-9]+' playwright.config.ts | grep -oE '[0-9]+' | head -1)
          {
            echo "## Outbound third-party calls"
            echo ""
            echo "Measured at \`workers: ${WORKERS:-unknown}\`."
            echo ""
            echo '```json'
            cat qa/.intercept-tally.json
            echo '```'
            echo ""
            echo "Per-IP rate limits apply to this runner's egress, not to a developer machine."
            echo "This is the measurement #114 needs before \`workers\` goes above 2."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # THE ONLY REQUIRED STATUS CHECK. Do not require `build` or `e2e` directly.
  #
  # GitHub's behaviour here is unintuitive and both halves are traps:
  #
  #   * A job skipped by its own `if:` reports SUCCESS to branch protection. So
  #     requiring `E2E (Playwright)` would be satisfied by it NOT running - which
  #     is now the normal case on every PR that is not a release.
  #   * A job skipped because `needs:` FAILED also reports SUCCESS. So requiring
  #     `e2e` while `build` is not required would let a broken build merge on a
  #     green tick.
  #
  # This job therefore asserts the REASON for a skip, not merely the absence of
  # a failure. always() rather than !cancelled() so a cancelled run still ends
  # red - harmless, because cancellation only happens when a newer SHA arrives
  # and checks are evaluated per-SHA.
  # ───────────────────────────────────────────────────────────────────────────
  gate:
    # The NAME is computed, and that is the whole point - it is what makes the
    # required check un-forgeable. QA found the hole on release PR #38.
    #
    # The bug: `CI Gate` was a fixed name, so EVERY event that touched a commit
    # published a check by that name. Every promotion is fast-forward, so the
    # merge commit on dev, the head of qa, the head of staging and the head of
    # the staging -> main release PR
    # are all the SAME SHA. A push to dev published `CI Gate: success` on it -
    # successful with E2E SKIPPED, because base_ref is empty on a push. GitHub
    # evaluates required checks per commit, so the release PR showed
    # `mergeable: true` while its own 34-minute suite was still running. A pass
    # from a run that never opened a browser could green-light a production
    # merge.
    #
    # Deleting the `push: [dev]` trigger would have fixed that one path and left
    # the hole open: a promotion PR publishes checks against the same
    # SHA too, also with E2E skipped. The fix has to be that the name itself
    # cannot appear except on a release PR.
    #
    # A job `if:` cannot do this. A job skipped by `if:` still creates a check
    # run, and branch protection counts a skipped check as SUCCESS - which is the
    # same trap this job exists to close, one level up.
    #
    # So: PRs into main publish `CI Gate`, the required context. Everything else
    # publishes `CI Gate (advisory)`, which no ruleset requires and which
    # therefore cannot satisfy anything. Same logic runs either way, so the
    # advisory result is still worth reading.
    name: ${{ github.base_ref == 'main' && 'CI Gate' || 'CI Gate (advisory)' }}
    if: ${{ always() }}
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that should have run, ran and passed
        env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          BASE: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          echo "build=$BUILD  e2e=$E2E  base=$BASE"
          fail=0
          # build carries no `if:`, so anything other than success is real.
          [ "$BUILD" = success ] || { echo "::error::build job: $BUILD"; fail=1; }
          if [ "$BASE" = main ]; then
            # A release PR. E2E was supposed to run. `skipped` here means build
            # died - and GitHub would otherwise report that skip as a green
            # check. This branch is what closes that hole.
            [ "$E2E" = success ] \
              || { echo "::error::e2e job: $E2E - required for a PR into main"; fail=1; }
          else
            # Not a release. E2E is expected to skip, but if it somehow ran and
            # failed, that is still a failure.
            case "$E2E" in
              success|skipped) ;;
              *) echo "::error::e2e job: $E2E"; fail=1 ;;
            esac
          fi
          exit $fail
