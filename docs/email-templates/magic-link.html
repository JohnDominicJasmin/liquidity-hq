<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f9;padding:40px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;border:1px solid #e5e7ef;max-width:480px;width:100%;">
      <tr><td style="padding:32px 32px 24px;">
        <div style="font-size:20px;font-weight:700;color:#12131a;letter-spacing:-0.3px;">Liquidity<span style="color:#5a6aff;">HQ</span></div>
      </td></tr>
      <tr><td style="padding:0 32px 8px;">
        <h1 style="margin:0;font-size:20px;font-weight:700;color:#12131a;">Sign in to LiquidityHQ</h1>
      </td></tr>
      <tr><td style="padding:0 32px 24px;">
        <p style="margin:0;font-size:15px;line-height:1.6;color:#4b4f5a;">
          Click the button below to sign in. This link expires shortly and can only be used once.
        </p>
      </td></tr>
      <tr><td style="padding:0 32px 24px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5a6aff;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:10px;">Sign in</a>
      </td></tr>
      <tr><td style="padding:0 32px 32px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#8a8f9c;">
          Or enter this code instead: <span style="font-family:ui-monospace,Consolas,monospace;color:#12131a;font-weight:600;">{{ .Token }}</span>
        </p>
      </td></tr>
      <tr><td style="padding:0 32px 32px;border-top:1px solid #eef0f5;">
        <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#8a8f9c;">
          If you didn't request this, you can safely ignore this email.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
